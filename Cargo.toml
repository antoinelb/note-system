[package]
name = "note-system"
version = "0.2.0"
edition = "2024"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
dioxus = { version = "0.7", features = ["desktop"] }
jiff = "0.2"
unicode-segmentation = "1"
notify-debouncer-full = "0.7"
# "hooks" is only used by the fault-injection tests in src/index.rs, but cargo
# features are not per-profile, so it has to be declared here
# the shape of what the webview answers a probe script with (src/launch.rs)
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "jiff"] }
tokio = { version = "1", features = ["time", "sync"] }
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts"] }
typst-layout = "0.15.1"
typst-svg = "0.15.1"
typst-syntax = "0.15"
typst-pdf = "0.15.1"

[lints.rust]
non_upper_case_globals = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[lints.clippy]
manual_range_contains = "allow"

[dev-dependencies]
# markup assertions for the UI tests (adr/2026-07-ui-covered-at-100.md)
dioxus-ssr = "0.7"
tempfile = "3.27.0"
# tests/integration/properties.rs (adr/2026-09-property-tests-guard-three-invariants.md)
proptest = "1"
